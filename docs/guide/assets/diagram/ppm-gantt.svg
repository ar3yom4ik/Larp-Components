<rect x='451.77777777777777' y='220' width='12' height='14' rx='3' fill='#5b4b8a' stroke='#5b4b8a' stroke-width='1.3'/>
<rect x='549.5555555555555' y='220' width='12' height='14' rx='3' fill='#5b4b8a' stroke='#5b4b8a' stroke-width='1.3'/>
<rect x='647.3333333333333' y='220' width='12' height='14' rx='3' fill='#5b4b8a' stroke='#5b4b8a' stroke-width='1.3'/>
<rect x='745.1111111111111' y='220' width='12' height='14' rx='3' fill='#5b4b8a' stroke='#5b4b8a' stroke-width='1.3'/>
<rect x='842.8888888888888' y='220' width='12' height='14' rx='3' fill='#5b4b8a' stroke='#5b4b8a' stroke-width='1.3'/>
<text x='918' y='231' class='xs' text-anchor='start'>4 h</text>
<text x='24' y='260' class='s' text-anchor='start'>Monthly: connectors, dust, ventilation / ежемесячно</text>
<rect x='354.0' y='250' width='12' height='14' rx='3' fill='#1d6fb8' stroke='#1d6fb8' stroke-width='1.3'/>
<rect x='451.77777777777777' y='250' width='12' height='14' rx='3' fill='#1d6fb8' stroke='#1d6fb8' stroke-width='1.3'/>
<rect x='549.5555555555555' y='250' width='12' height='14' rx='3' fill='#1d6fb8' stroke='#1d6fb8' stroke-width='1.3'/>
<rect x='647.3333333333333' y='250' width='12' height='14' rx='3' fill='#1d6fb8' stroke='#1d6fb8' stroke-width='1.3'/>
<rect x='745.1111111111111' y='250' width='12' height='14' rx='3' fill='#1d6fb8' stroke='#1d6fb8' stroke-width='1.3'/>
<rect x='842.8888888888888' y='250' width='12' height='14' rx='3' fill='#1d6fb8' stroke='#1d6fb8' stroke-width='1.3'/>
<text x='918' y='261' class='xs' text-anchor='start'>1 h</text>
<text x='24' y='290' class='s' text-anchor='start'>Quarterly: torque, belts, backlash, brakes</text>
<rect x='574.0' y='280' width='12' height='14' rx='3' fill='#c8891a' stroke='#c8891a' stroke-width='1.3'/>
<rect x='842.8888888888888' y='280' width='12' height='14' rx='3' fill='#c8891a' stroke='#c8891a' stroke-width='1.3'/>
<text x='918' y='291' class='xs' text-anchor='start'>3 h</text>
<text x='24' y='320' class='s' text-anchor='start'>Half-year review + next schedule issued</text>
<rect x='891.7777777777777' y='310' width='12' height='14' rx='3' fill='#2f7d4f' stroke='#2f7d4f' stroke-width='1.3'/>
<text x='918' y='321' class='xs' text-anchor='start'>1 h</text>
<text x='24' y='350' class='s' text-anchor='start'>Battery check (voltage) / контроль батарей</text>
<rect x='745.1111111111111' y='340' width='12' height='14' rx='3' fill='#5b4b8a' stroke='#5b4b8a' stroke-width='1.3'/>
<text x='918' y='351' class='xs' text-anchor='start'>1 h</text>
<line x1='250' y1='362' x2='910' y2='362' stroke='#dfe3e8' stroke-width='1.2'/>
<rect x='24' y='374' width='440' height='92' rx='8' fill='#fdf1da' stroke='#c8891a' stroke-width='1.3'/>
<text x='34' y='396' class='b' text-anchor='start'>Planned vs unplanned / план против факта</text>
<text x='34' y='413' class='mono' text-anchor='start'>planned downtime, 6 months            12 h</text>
<text x='34' y='430' class='mono' text-anchor='start'>unplanned at 1 × INTP-106/week, 35 min    91 h</text>
<text x='34' y='447' class='mono' text-anchor='start'>net saving at the observed failure rate  ≈ 79 h</text>
<text x='34' y='464' class='xs' text-anchor='start'>plus: failures moved to scheduled weekend windows</text>
<rect x='480' y='374' width='456' height='92' rx='8' fill='#f8f9fa' stroke='#c3c9d1' stroke-width='1.3'/>
<text x='490' y='396' class='b' text-anchor='start'>Who signs what / кто что подписывает</text>
<text x='490' y='413' class='s' text-anchor='start'>operator — daily checklist, initials and time</text>
<text x='490' y='430' class='s' text-anchor='start'>technician — monthly and quarterly work orders, records</text>
<text x='490' y='447' class='s' text-anchor='start'>engineer — owns the programme, approves interval changes</text>
<text x='490' y='464' class='s' text-anchor='start'>plant manager — downtime windows and spares budget</text>
<line x1='24' y1='436' x2='936' y2='436' stroke='#dfe3e8' stroke-width='1.2'/>
<text x='24' y='456' class='xs' text-anchor='start'>Intervals converted from the manual’s hour table using the cell’s measured duty of ~350 h/month; the assumption is stated in Part 3.1.</text>
</svg>