<text x='918' y='141' class='xs' text-anchor='start'>10 min/shift</text>
<text x='24' y='170' class='s' text-anchor='start'>Weekly gripper, vacuum, interlocks / еженедельно</text>
<line x1='250' y1='167' x2='910' y2='167' stroke='#2f7d4f' stroke-width='3' stroke-dasharray='2 6'/>
<text x='918' y='171' class='xs' text-anchor='start'>20 min/week</text>
