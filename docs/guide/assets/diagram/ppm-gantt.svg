<text x='918' y='201' class='xs' text-anchor='start'>4 h</text>
<text x='24' y='230' class='s' text-anchor='start'>Full backup ALL_OF_ABOVE + SYSMAST.SV (monthly)</text>
<rect x='256.22222222222223' y='220' width='12' height='14' rx='3' fill='#5b4b8a' stroke='#5b4b8a' stroke-width='1.3'/>
