<rect width='960' height='470' fill='#ffffff'/>
<text x='24' y='32' class='tt' text-anchor='start'>Six-month PPM calendar — 27 weeks from 16 Nov 2026</text>
<text x='24' y='52' class='st' text-anchor='start'>Календарь ППР на шесть месяцев — 27 недель с 16.11.2026</text>
<text x='936' y='32' class='f' text-anchor='end'>Part 3 · Часть 3</text>
