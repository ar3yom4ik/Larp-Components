<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 600' width='960' height='600' role='img' aria-label='Mastering recovery decision tree'>
<title>Mastering recovery decision tree</title>
<defs>
<marker id='ar-ink' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#1c2024'/></marker>
<marker id='ar-mut' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#4a535c'/></marker>
<marker id='ar-fa' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#77818c'/></marker>
<marker id='ar-ln' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c3c9d1'/></marker>
<marker id='ar-br' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#b4472e'/></marker>
<marker id='ar-st' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#1d6fb8'/></marker>
<marker id='ar-am' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#c8891a'/></marker>
<marker id='ar-gr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2f7d4f'/></marker>
<marker id='ar-rd' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#b3261e'/></marker>
</defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,'Helvetica Neue',sans-serif;fill:#1c2024;font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px}.b{font-weight:650}.m{fill:#4a535c}.f{fill:#77818c;font-size:11.5px}.s{font-size:11.5px}.xs{font-size:10.5px;fill:#77818c}.tt{font-size:17px;font-weight:700}.st{font-size:12.5px;fill:#4a535c}.cap{font-size:12px;fill:#4a535c}.white{fill:#fff;font-weight:650}</style>
<rect width='960' height='600' fill='#ffffff'/>
<text x='24' y='32' class='tt' text-anchor='start'>Mastering lost — choose the recovery route</text>
<text x='24' y='52' class='st' text-anchor='start'>Мастерение потеряно — выбор пути восстановления</text>
<text x='936' y='32' class='f' text-anchor='end'>Part 4 · Часть 4</text>
<line x1='24' y1='64' x2='936' y2='64' stroke='#dfe3e8' stroke-width='1.2'/>
<rect x='270' y='84' width='420' height='50' rx='8' fill='#fde7e5' stroke='#b3261e' stroke-width='1.3'/>
<text x='279' y='105' class='b' text-anchor='start'>Power was OFF while the APC battery was disconnected</text>
<text x='279' y='122' class='s' text-anchor='start'>SRVO-062 BZAL · display ≠ pose · taught points invalid</text>
<line x1='480' y1='136' x2='480' y2='158' stroke='#b3261e' stroke-width='1.8' marker-end='url(#ar-rd)'/>
<rect x='300' y='160' width='360' height='52' rx='8' fill='#f8f9fa' stroke='#c3c9d1' stroke-width='1.3'/>
<text x='309' y='181' class='s' text-anchor='start'>First: E-stop, no programs, photograph the pose,</text>
<text x='309' y='197' class='s' text-anchor='start'>support the arm, check the new battery is latched</text>
<line x1='480' y1='214' x2='480' y2='236' stroke='#77818c' stroke-width='1.6' marker-end='url(#ar-fa)'/>
<rect x='24' y='244' width='250' height='74' rx='8' fill='#fff' stroke='#c3c9d1' stroke-width='1.3'/>
<text x='34' y='266' class='s' text-anchor='start'>YES — SYSMAST.SV exists, coder intact?</text>
<text x='34' y='283' class='s' text-anchor='start'></text>
<text x='34' y='300' class='xs' text-anchor='start'>decision / решение</text>
<line x1='278' y1='281' x2='306' y2='281' stroke='#77818c' stroke-width='1.6' marker-end='url(#ar-fa)'/>
<rect x='310' y='244' width='400' height='74' rx='8' fill='#e2f3e9' stroke='#2f7d4f' stroke-width='1.3'/>
<text x='319' y='265' class='b' text-anchor='start'>QUICK MASTER   ·   15–20 min</text>
<text x='319' y='281' class='s' text-anchor='start'>FILE → UTIL → Set Device USB → LOAD SYSMAST.SV</text>
<text x='319' y='297' class='s' text-anchor='start'>Master/Cal → QUICK MASTER → CALIBRATE → verify</text>
<text x='319' y='313' class='xs' text-anchor='start'>restores the commissioned reference exactly</text>
<rect x='24' y='330' width='250' height='74' rx='8' fill='#fff' stroke='#c3c9d1' stroke-width='1.3'/>
<text x='34' y='352' class='s' text-anchor='start'>NO · 1–2 axes — belt or motor work only?</text>
<text x='34' y='369' class='s' text-anchor='start'></text>
<text x='34' y='386' class='xs' text-anchor='start'>decision / решение</text>
<line x1='278' y1='367' x2='306' y2='367' stroke='#77818c' stroke-width='1.6' marker-end='url(#ar-fa)'/>
<rect x='310' y='330' width='400' height='74' rx='8' fill='#fdf1da' stroke='#c8891a' stroke-width='1.3'/>
<text x='319' y='351' class='b' text-anchor='start'>SINGLE AXIS MASTER   ·   20–30 min / axis</text>
<text x='319' y='367' class='s' text-anchor='start'>Master/Cal → SEL = 1 → jog to witness marks</text>
<text x='319' y='383' class='s' text-anchor='start'>MSTR POS = 0 → F5 EXEC → SEL = 0 → CALIBRATE</text>
<text x='319' y='399' class='xs' text-anchor='start'>J5 work always includes J6 — same wrist</text>
<rect x='24' y='416' width='250' height='74' rx='8' fill='#fff' stroke='#c3c9d1' stroke-width='1.3'/>
<text x='34' y='438' class='s' text-anchor='start'>NO · all axes — fixture? if not, zero position</text>
<text x='34' y='455' class='s' text-anchor='start'></text>
<text x='34' y='472' class='xs' text-anchor='start'>decision / решение</text>
<line x1='278' y1='453' x2='306' y2='453' stroke='#77818c' stroke-width='1.6' marker-end='url(#ar-fa)'/>
<rect x='310' y='416' width='400' height='74' rx='8' fill='#f6e3dc' stroke='#b4472e' stroke-width='1.3'/>
<text x='319' y='437' class='b' text-anchor='start'>FIXTURE / ZERO POSITION MASTER   ·   1–2 h</text>
<text x='319' y='453' class='s' text-anchor='start'>align all six witness marks (arm supported)</text>
<text x='319' y='469' class='s' text-anchor='start'>Master/Cal → ZERO POSITION MASTER → CALIBRATE</text>
<text x='319' y='485' class='xs' text-anchor='start'>then re-verify every taught point</text>
<rect x='740' y='244' width='196' height='244' rx='8' fill='#e2eefb' stroke='#1d6fb8' stroke-width='1.3'/>
<text x='750' y='266' class='b' text-anchor='start'>If SRVO-038 appears</text>
<text x='750' y='281' class='s' text-anchor='start'>after the recovery:</text>
<text x='750' y='296' class='s' text-anchor='start'></text>
<text x='750' y='311' class='mono' text-anchor='start'>Master/Cal → RES_PCA</text>
<text x='750' y='326' class='mono' text-anchor='start'>→ power cycle</text>
<text x='750' y='341' class='mono' text-anchor='start'>→ jog the axis ≥ 1</text>
<text x='750' y='356' class='mono' text-anchor='start'>  motor revolution</text>
<text x='750' y='371' class='mono' text-anchor='start'>→ verify marks</text>
<text x='750' y='386' class='mono' text-anchor='start'>→ MASTER_DONE = TRUE</text>
<text x='750' y='401' class='mono' text-anchor='start'>→ CALIBRATE</text>
<text x='750' y='416' class='s' text-anchor='start'></text>
<text x='750' y='431' class='xs' text-anchor='start'>never RES_PCA and then</text>
<text x='750' y='446' class='xs' text-anchor='start'>just reset: every point</text>
<text x='750' y='461' class='xs' text-anchor='start'>stays offset by a constant</text>
<rect x='24' y='500' width='912' height='62' rx='8' fill='#e2f3e9' stroke='#2f7d4f' stroke-width='1.3'/>
<text x='33' y='521' class='b' text-anchor='start'>After any successful route / после любого успешного пути</text>
<text x='33' y='538' class='s' text-anchor='start'>SET QUICK MASTER REF  →  full backup incl. SYSMAST.SV, two locations  →  verify in T1: zero position, taught points, one loaded pallet at 10 %</text>
<text x='33' y='555' class='s' text-anchor='start'>then print the power-ON battery rule on the cell wall so the incident cannot repeat (Part 4.7)</text>
<line x1='24' y1='566' x2='936' y2='566' stroke='#dfe3e8' stroke-width='1.2'/>
<text x='24' y='586' class='xs' text-anchor='start'>Quick Master is impossible after a pulse-coder replacement or when the mastering data itself is gone — the manual says so, and the tree honours it.</text>
</svg>