<text x='50' y='426' class='b' text-anchor='start'>Pose and access / Поза и доступ</text>
<text x='50' y='442' class='s' text-anchor='start'>• power OFF, lock out, arm supported</text>
<text x='50' y='458' class='s' text-anchor='start'>• jog first to J3 = 80°, J5 = ±90° — the same pose every time</text>
<text x='50' y='474' class='s' text-anchor='start'>• remove cover bolt + cover, then the gasket (clean side up)</text>
<text x='50' y='490' class='s' text-anchor='start'>• cover bolt on reassembly: 5.6 N·m, fresh witness marks</text>
<text x='50' y='506' class='s' text-anchor='start'>• pluck once, read when stable, three readings per axis</text>
<rect x='500' y='100' width='436' height='116' rx='8' fill='#e2eefb' stroke='#1d6fb8' stroke-width='1.3'/>
<text x='510' y='122' class='b' text-anchor='start'>Tensionmeter A97L-0218-0700 — settings / установки</text>
<text x='510' y='138' class='mono' text-anchor='start'>belt type            timing belt, metric</text>
<text x='510' y='154' class='mono' text-anchor='start'>belt mass per length 0.02083 kg/m</text>
<text x='510' y='170' class='mono' text-anchor='start'>belt width           4 mm</text>
<text x='510' y='186' class='mono' text-anchor='start'>span length          187 mm   (J6: 116 mm)</text>
<text x='510' y='202' class='mono' text-anchor='start'>result unit          N        strands: 1</text>
<rect x='500' y='228' width='436' height='84' rx='8' fill='#fde7e5' stroke='#b3261e' stroke-width='1.3'/>
