<text x='757.1428571428571' y='336' class='xs' text-anchor='start'>re-tension target ≈ 18 N</text>
<rect x='500' y='436' width='436' height='76' rx='8' fill='#f8f9fa' stroke='#c3c9d1' stroke-width='1.3'/>
<text x='509' y='457' class='b' text-anchor='start'>Decisions / Решения</text>
<text x='509' y='473' class='s' text-anchor='start'>below 15.6 N  →  re-tension or replace A98L-0040-0286#004-157, then master J5 + J6</text>
<text x='509' y='489' class='s' text-anchor='start'>in band       →  the wrist is fine; hunt electrical, path and interlock causes</text>
<text x='509' y='505' class='s' text-anchor='start'>above 20.6 N  →  over-tensioned: motor bearings and reducer loaded; loosen to the middle</text>
<line x1='24' y1='546' x2='936' y2='546' stroke='#dfe3e8' stroke-width='1.2'/>
<text x='24' y='566' class='xs' text-anchor='start'>Belt parameters from Maintenance Manual B-83495EN §6.1; the example readings are the guide’s scenario values.</text>
