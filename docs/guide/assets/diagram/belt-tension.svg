<text x='510' y='267' class='mono' text-anchor='start'>12.8 N      13.1 N      12.9 N      →  mean 12.9 N</text>
<text x='510' y='284' class='s' text-anchor='start'>specification 15.6–20.6 N  →  BELOW by 2.7 N / ниже нормы</text>
<text x='510' y='301' class='s' text-anchor='start'>J6 control: 17.4 / 17.6 / 17.5 → mean 17.5 N — in band / в норме</text>
<text x='500' y='348' class='b' text-anchor='start'>N</text>
