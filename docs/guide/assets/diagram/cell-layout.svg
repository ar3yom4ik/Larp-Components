<text x='33' y='677' class='b' text-anchor='start'>Layout rules / Правила планировки</text>
<text x='33' y='693' class='s' text-anchor='start'>• base 650 mm from the indexer centre, on the long-side centreline   • farthest stack point 884 mm ≤ 911 mm reach</text>
<text x='33' y='709' class='s' text-anchor='start'>• 705 mm height clearance above the arm   • fence outside the stopping envelope (J1 travels up to 69° on a power-off stop)</text>
<text x='33' y='725' class='s' text-anchor='start'>• cabinet outside the fence with ventilation unobstructed   • 500 mm maintenance clearance where a technician must stand</text>
